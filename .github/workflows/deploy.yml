name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
      - master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Type-check and unit tests gate the deploy. `tsc` alone is not enough —
      # a missing runtime dependency once passed type-check and still broke the
      # build — so the real build below remains the final gate.
      - name: Type Check
        run: npx tsc --noEmit

      - name: Unit Tests
        run: npm test

      # `firestore.rules` is the only authorization boundary this app has, so
      # its behaviour is asserted against the real emulator rather than trusted
      # to review. A hard gate on purpose: shipping rules that let one teacher
      # read another's discipline record is worse than not shipping at all.
      #
      # The emulator runs on the JVM and firebase-tools requires JDK 21+.
      - name: Setup Java for Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Security Rules Tests
        run: npm run test:rules

      - name: Build Project
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          NEXT_PUBLIC_ADMIN_EMAILS: ${{ secrets.NEXT_PUBLIC_ADMIN_EMAILS }}
          # Web Push certificate (VAPID public key). Written inline rather than
          # kept as a secret because it is genuinely public — it ships inside
          # the client bundle by design, so hiding it here would protect
          # nothing while adding a configuration step that, if forgotten, fails
          # SILENTLY: the build succeeds, `isPushConfigured()` returns false,
          # and the notification toggle simply never appears.
          #
          # The bot token in settings/telegram is the opposite case and must
          # never be treated this way.
          NEXT_PUBLIC_FIREBASE_VAPID_KEY: BBR-nnaEdYcwMXKpfBZS4RQ69c1MWNd8onwWItDvBE2dhNyeOX7-w-h8qAx0zn3yzsHT2Rj29O3ewj_1mcc1zZs
          # Falls back to 'edutask' in lib/firebase.ts, so an unset secret is
          # harmless — passed through for the case where it differs.
          NEXT_PUBLIC_FIREBASE_UPLOAD_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_UPLOAD_BUCKET }}

      - name: Check Firebase Service Account Secret
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_APP_FROM_AI || secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::error::Thiếu GitHub Secret FIREBASE_SERVICE_ACCOUNT_APP_FROM_AI! Vui lòng thêm secret vào GitHub Repo Settings -> Secrets -> Actions."
            exit 1
          fi

      # Security rules are the ONLY authorization boundary for this app (the
      # client talks to Firestore directly), so CI tries to ship them with the
      # code. Runs before hosting: if rules are rejected, the old frontend keeps
      # running against the old rules instead of a mismatched pair.
      #
      # This step does NOT fail the job. The Firebase CLI first calls
      # serviceusage.googleapis.com to confirm the Firestore API is enabled, and
      # that call 403s unless the deploy service account holds
      # `roles/serviceusage.serviceUsageConsumer`. Blocking the whole pipeline on
      # a permission check would stop hosting from shipping too, so a failure is
      # surfaced as a loud warning instead and the rules are applied by hand.
      #
      # TO RE-ENABLE FULL AUTOMATION: in Google Cloud Console -> IAM, grant the
      # deploy service account both:
      #   - roles/serviceusage.serviceUsageConsumer
      #   - roles/firebaserules.admin
      # then flip `continue-on-error` to false so drift becomes a hard failure.
      - name: Deploy Security Rules (Firestore + Storage)
        id: deploy_rules
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-service-account.json
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_APP_FROM_AI || secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          npx --yes firebase-tools@15 deploy \
            --only firestore:rules,storage \
            --project app-from-ai \
            --non-interactive

      - name: Warn if rules were not deployed
        if: steps.deploy_rules.outcome == 'failure'
        run: |
          echo "::warning title=Security rules NOT deployed::CI could not deploy firestore.rules / storage.rules (usually a missing serviceusage.serviceUsageConsumer role on the deploy service account). The frontend below WILL ship. Apply both rule files manually in the Firebase Console, or grant the IAM roles listed in deploy.yml."

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_APP_FROM_AI || secrets.FIREBASE_SERVICE_ACCOUNT }}'
          target: edutask
          channelId: live
          projectId: app-from-ai
